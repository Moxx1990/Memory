<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory</title>
</head>
<body>

    <header></header>

    <main>
        <section id="intro" class="intro">
            <div class="intro__background">
                <div class="intro__content">
                    <h2 class="intro__content--subheading">It's play time.</h2>
                    <h1 class="intro__content--heading">Ready to play?</h1>

                    <button type="button" class="intro--button">
                        <img class="intro--button--icon" src="./assets/start/controller.svg" alt="Play button">
                        Play
                        <img class="intro--button--arrow" src="./assets/start/arrow.svg" alt="Play button">
                    </button>
                </div>
                <img src="./assets/start/controllerbackground.svg" class="intro__background--image" alt="Memory game">
            </div>
        </section>
        
        <section id="settings" class="settings-page">
            <h1 class="settings--heading">Settings</h1>
            <img class="settings--heading--icon" src="./assets/settings/line.svg" alt="Settings icon">

            <div class="settings__layout">
                <div class="settings">
                    <div class="settings__group settings__group--hoverable">
                        <label class="settings__label"><img src="./assets/settings/style.svg" alt="Game themes icon">Game themes</label>
                        <div class="settings__options">
                            <label class="settings__option">
                                <input type="radio" name="theme" value="code" data-image="codevibes.jpg">
                                <span class="settings__btn">Code vibes<img src="./assets/settings/arrow.svg" alt="Game themes icon"></span>
                            </label>
                            <label class="settings__option">
                                <input type="radio" name="theme" value="gaming" data-image="games.jpg">
                                <span class="settings__btn">Gaming<img src="./assets/settings/arrow.svg" alt="Game themes icon"></span>
                            </label>
                            <label class="settings__option">
                                <input type="radio" name="theme" value="da-projects" data-image="daprojects.jpg">
                                <span class="settings__btn">DA Projects<img src="./assets/settings/arrow.svg" alt="Game themes icon"></span>
                            </label>
                            <label class="settings__option">
                                <input type="radio" name="theme" value="food" data-image="food.jpg">
                                <span class="settings__btn">Food<img src="./assets/settings/arrow.svg" alt="Game themes icon"></span>
                            </label>
                        </div>
                    </div>

                    <div class="settings__group settings__group--hoverable">
                        <label class="settings__label"><img src="./assets/settings/player.svg" alt="Choose player icon">Choose player</label>
                        <div class="settings__options">
                            <label class="settings__option">
                                <input type="radio" name="player" value="blue">
                                <span class="settings__btn">Blue<img src="./assets/settings/arrow.svg" alt="Game themes icon"></span>
                            </label>
                            <label class="settings__option">
                                <input type="radio" name="player" value="orange">
                                <span class="settings__btn">Orange<img src="./assets/settings/arrow.svg" alt="Game themes icon"></span>
                            </label>
                        </div>
                    </div>

                    <div class="settings__group settings__group--hoverable">
                        <label class="settings__label"><img src="./assets/settings/size.svg" alt="Board size icon">Board size</label>
                        <div class="settings__options">
                            <label class="settings__option">
                                <input type="radio" name="size" value="16">
                                <span class="settings__btn">16 cards<img src="./assets/settings/arrow.svg" alt="Game themes icon"></span>
                            </label>
                            <label class="settings__option">
                                <input type="radio" name="size" value="24">
                                <span class="settings__btn">24 cards<img src="./assets/settings/arrow.svg" alt="Game themes icon"></span>
                            </label>
                            <label class="settings__option">
                                <input type="radio" name="size" value="36">
                                <span class="settings__btn">36 cards<img src="./assets/settings/arrow.svg" alt="Game themes icon"></span>
                            </label>
                        </div>
                    </div>
                </div>

                <aside class="summary">
                    <img id="preview-image" src="./assets/settings/themes/codevibes.jpg" alt="Preview Image" class="summary__image">

                    <div class="summary__bar">
                        <div id="summary-items" class="summary__items"></div>
                        <button id="start-btn" class="summary__start-btn" disabled>
                            <img src="./assets/settings/play.svg" alt="" class="summary__start-icon">
                            <span>Start</span>
                        </button>
                    </div>
                </aside>
            </div>
        </section>
        
        <section id="board" class="board">
            <div class="board__header">
                <div class="board__scores">
    <span class="board__score board__score--blue">
        <img id="player-icon-blue" src="./assets/themes/codevibes/blueplayer.svg" alt="Blue player" class="board__score-icon">
        Blue <b id="score-blue">0</b>
    </span>
    <span class="board__score board__score--orange">
        <img id="player-icon-orange" src="./assets/themes/codevibes/orangeplayer.svg" alt="Orange player" class="board__score-icon">
        Orange <b id="score-orange">0</b>
    </span>
</div>

                <div class="board__current-player">
  Current Player: 
  <span id="current-player-display" class="board__player-badge">
    <img id="current-player-img" src="" alt="Current Player" />
  </span>
</div>

                <button id="open-exit-modal-btn" class="board__exit-btn">
    <span class="board__exit-icon"></span>
    Exit game
</button>
            </div>

            <dialog id="exit-modal" class="board__modal">
                <div class="board__modal-content">
                    <p class="board__modal-text">Are you sure you want to quit the game?</p>
                    <div class="board__modal-actions">
                        <button id="cancel-exit-btn" class="board__modal-btn board__modal-btn--cancel">No, back to game</button>
                        <button id="confirm-exit-btn" class="board__modal-btn board__modal-btn--confirm">Yes, quit game</button>
                    </div>
                </div>
            </dialog>

            <div id="field" class="board__field"></div>
        </section>

        <section id="game-over" class="game-over">
            <div class="game-over__content">
                <img id="game-over-img" src="" alt="Game Over" class="game-over__img" />
                <h2 class="game-over__title">Final Score</h2>
                <div class="game-over__scores">
                    <span class="game-over__score game-over__score--blue">Blue: <strong id="final-score-blue">0</strong></span>
                    <span class="game-over__divider">/</span>
                    <span class="game-over__score game-over__score--orange">Orange: <strong id="final-score-orange">0</strong></span>
                </div>
            </div>
        </section>

        <section id="result" class="result">
            <div class="result__content">
                <h2 id="result-subtitle" class="result__subtitle">The winner is</h2>
                <h1 id="result-title" class="result__title">Blue Player</h1>
                
                <img id="result-img" src="" alt="Result" class="result__img" />

                <button id="restart-btn" class="result__btn">
                    Home
                </button>
            </div>
        </section>

    </main>

    <footer></footer>
    
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
